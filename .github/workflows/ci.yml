on: [push, pull_request]

name: Continuous integration

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # HiGHS (good_lp's MILP backend) is vendored C++: cmake + a C++ compiler build it, and
      # bindgen needs libclang to generate its FFI bindings. ubuntu-latest ships a C++ compiler
      # already; cmake/libclang-dev are the two packages that are not guaranteed present.
      - name: Install HiGHS build dependencies (cmake, libclang)
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --workspace

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install HiGHS build dependencies (cmake, libclang)
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace
      # The catch-up timing criterion (item F acceptance-3) is `#[ignore]`d in debug builds — it
      # costs ~5 min/scenario there — so it's skipped by the --workspace run above and enforced here
      # instead, release, on its own: this is what actually checks the <16 s budget.
      #
      # `cargo test <name>` filters by SUBSTRING and exits 0 even when nothing matched ("running 0
      # tests" is still success) — a plain `actions-rs/cargo@v1` step here would silently pass if
      # this test were ever renamed or deleted, exactly the gap it exists to close (rework cycle 1,
      # finding 4a; verified: `cargo test --release this_test_name_does_not_exist` -> exit 0). So:
      # `--exact` against the test's full module path, and grep the summary line for `1 passed` —
      # `0 passed`/no match fails the step even though cargo's own exit code was 0.
      - name: Catch-up timing criterion (release)
        run: |
          cargo test --release optimize::solve_timing::catch_up_demand_solves_within_budget -- --exact --nocapture 2>&1 | tee /tmp/catchup-timing.log
          if ! grep -qE '^test result: ok\. 1 passed; 0 failed;' /tmp/catchup-timing.log; then
            echo "ERROR: catch_up_demand_solves_within_budget did not report exactly 1 passed (renamed, deleted, or failed?) -- see the log above"
            exit 1
          fi

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install HiGHS build dependencies (cmake, libclang)
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --manifest-path Cargo.toml --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install HiGHS build dependencies (cmake, libclang)
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --workspace --all-targets -- -D warnings

  readonly:
    name: MPC read-only (no MQTT/actuation dep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install HiGHS build dependencies (cmake, libclang)
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      # The shadow MPC must be structurally incapable of actuating: it must not link any MQTT crate.
      # `cargo tree` runs on its own line so a tool failure (renamed package, resolver error) fails
      # the job — inside the old `if` pipeline its exit status was swallowed by grep and the gate
      # would silently pass without checking anything.
      - name: Assert mpc_home_control links no MQTT crate
        run: |
          cargo tree -p mpc_home_control > /tmp/mpc-deps.txt
          test -s /tmp/mpc-deps.txt
          if grep -E 'rumqttc|paho-mqtt' /tmp/mpc-deps.txt; then
            echo "ERROR: an MQTT crate is linked into the read-only MPC binary"; exit 1
          fi
          echo "OK: mpc_home_control has no MQTT dependency"

  tarpaulin:
    name: Tarpaulin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install HiGHS build dependencies (cmake, libclang)
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run cargo-tarpaulin
        run: cargo tarpaulin --manifest-path Cargo.toml --out Xml -- --test-threads 1

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v4
        with:
          token: ${{secrets.CODECOV_TOKEN}}
        continue-on-error: true

      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: cobertura.xml
          if-no-files-found: warn
